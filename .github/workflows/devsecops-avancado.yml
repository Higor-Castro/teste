name: DevSecOps Avançado

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dast-zap:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: studyflow
          POSTGRES_USER: studyflow
          POSTGRES_PASSWORD: studyflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studyflow -d studyflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Compilar a imagem Docker da aplicação
        run: docker build --pull -t studyflow-api:ci .

      - name: Subir a aplicação localmente
        run: |
          docker run -d --name studyflow-api --network host \
            -e DATABASE_URL=jdbc:postgresql://localhost:5432/studyflow \
            -e DATABASE_USERNAME=studyflow \
            -e DATABASE_PASSWORD=studyflow_ci \
            -e BREVO_API_KEY=chave-falsa-ci \
            -e BREVO_EMAIL=ci@example.com \
            -e JWT_SECRET=segredo-de-teste-ci-com-mais-de-32-caracteres-123456 \
            -e SERVER_FORWARD_HEADERS_STRATEGY=native \
            studyflow-api:ci

      - name: Esperar a API responder
        run: |
          for i in $(seq 1 60); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H 'X-Forwarded-Proto: https' \
              http://localhost:8080/users/validar || true)

            echo "tentativa $i -> HTTP $code"
            if [ "$code" != "000" ] && [ "$code" != "404" ] && [ "$code" != "301" ] && [ "$code" != "302" ]; then
              exit 0
            fi
            sleep 3
          done
          echo "A aplicação não subiu. Logs:"
          docker logs studyflow-api --tail 200
          exit 1

      - name: DAST - OWASP ZAP API Scan
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          target: '.zap/openapi.yaml'
          format: openapi
          rules_file_name: '.zap/rules.tsv'
          cmd_options: >
            -I -z
            "-config replacer.full_list(0).description=xfp
            -config replacer.full_list(0).enabled=true
            -config replacer.full_list(0).matchtype=REQ_HEADER
            -config replacer.full_list(0).matchstring=X-Forwarded-Proto
            -config replacer.full_list(0).replacement=https"
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-relatorio-dast

      - name: Logs da aplicação em caso de falha
        if: failure()
        run: docker logs studyflow-api --tail 200

      - name: Finalizar contêiner
        if: always()
        run: docker rm -f studyflow-api || true

  privacidade-bearer:
    name: Privacidade - Bearer
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Bearer - scan de privacidade e dados sensíveis
        uses: bearer/bearer-action@v2
        with:
          path: .
          scanner: sast,secrets
          severity: critical,high
          skip-path: 'Docs/*,src/test/*'
          format: json
          output: bearer-relatorio.json
          exit-code: 1

      - name: Guardar relatório do Bearer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bearer-relatorio
          path: bearer-relatorio.json
          if-no-files-found: ignore

  sbom-trivy:
    name: SBOM - Trivy
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Resolver dependências Maven
        run: mvn -B -q -DskipTests dependency:resolve

      - name: Instalar Trivy v0.69.3 com validação de integridade
        run: |
          curl -sSL -o trivy.tgz https://github.com/aquasecurity/trivy/releases/download/v0.69.3/trivy_0.69.3_Linux-64bit.tar.gz
          echo "1816b632dfe529869c740c0913e36bd1629cb7688bd5634f4a858c1d57c88b75  trivy.tgz" | sha256sum -c -
          tar xzf trivy.tgz trivy
          sudo mv trivy /usr/local/bin/trivy
          trivy --version

      - name: Gerar SBOM em formato CycloneDX
        run: trivy fs --format cyclonedx --output sbom.json .

      - name: Validar o SBOM e resumir no relatório do job
        run: |
          jq -e '.bomFormat == "CycloneDX"' sbom.json
          total=$(jq '.components | length' sbom.json)
          echo "Componentes no SBOM: $total"
          {
            echo "### SBOM gerado (CycloneDX)"
            echo "Total de componentes: **$total**"
            echo
            echo "| Componente | Versão |"
            echo "|---|---|"
            jq -r '.components[] | select(.version != null) | "| \(.name) | \(.version) |"' sbom.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar SBOM como artefato
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.json
          retention-days: 90